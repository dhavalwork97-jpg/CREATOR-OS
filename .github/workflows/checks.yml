name: Creator OS checks

on:
  push:
    branches: [feature/vercel-neon-secure-backend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: node --check 'api/[...path].mjs'
